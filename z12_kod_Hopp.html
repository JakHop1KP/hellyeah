<!DOCTYPE html>

</head>
<body>
    <div style="color:green;font-size:39px;">
        <script language="JavaScript">
// Jakub Hoppe 2KP
// Zadanie 12
            var D1_hop=prompt("Dzień1 D1=","");
            var G1_hop=prompt("Godzina1 G1=","");
            var D2_hop=prompt("Dzień2 D2=","");
            var G2_hop=prompt("Godzina2 G2=","");
            var a=parseFloat(D1_hop);
            var b=parseFloat(G1_hop);
            var c=parseFloat(D2_hop);
            var d=parseFloat(G2_hop);
            var sekund_hop=((a-c)*24+(b-d))*60*60;
            document.write("D1="+a+"<br>");
            document.write("G1="+b+"<br>");
            document.write("D2="+c+"<br>");
            document.write("G2="+d+"<br>");
            document.write("ilość sekund= "+sekund_hop+" sekund<br>");
            function okno_zamknij_hoppe()
            {
                window.close()
            }
        </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_hoppe()"/>
</body>
