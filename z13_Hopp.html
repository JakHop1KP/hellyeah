<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Hoppe Z13</title>
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
// Jakub Hoppe 2KP
// Zadanie 13
            var liczba1=prompt("podaj mianownik m=","");
            var m_hop=parseFloat(liczba1);
            var m1_hop=m_hop+1;
            var m2_hop=m_hop*(m_hop+1);
            document.write("m="+m_hop+"<br>");
            document.write("1/"+m_hop+"=1/"+m1_hop+"+1/"+m2_hop+"<br>");
            function okno_zamknij_hoppe()
            {
                window.close()
            }
        </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_hoppe()"/>
</body>
</html>
